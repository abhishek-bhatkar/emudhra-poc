# Add these repository secrets:
#   CLOUDFLARE_API_TOKEN   token with Account > Workers Scripts > Edit
#   CLOUDFLARE_ACCOUNT_ID  your account
name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "worker/src/**"
      - "worker/wrangler.toml"
      - "worker/wrangler.site.toml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.69.0"

jobs:
  deploy-probe:
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-chain-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy -c worker/wrangler.toml

  deploy-site:
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-workers-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy -c worker/wrangler.site.toml
